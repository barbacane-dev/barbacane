openapi: "3.1.0"
info:
  title: Plaintext secret test
  version: "1.0.0"
# A config field marked `writeOnly` in the plugin's config-schema.json (here
# s3's `secret_access_key`) must not be a plaintext literal: it would be baked
# into the compiled artifact. The generated dispatch validator must surface this
# (mirrors compiler warning E1070). Using an env:// / file:// reference is clean.
paths:
  /assets:
    get:
      operationId: getAssets
      summary: s3 config with a plaintext secret_access_key
      x-barbacane-dispatch:
        name: s3
        config:
          access_key_id: "env://AWS_ACCESS_KEY_ID"
          secret_access_key: "plaintext-should-warn"
          region: eu-west-1
          bucket: assets
      responses:
        "200":
          description: OK
