name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; jobs that push images / upload SARIF / create the
# release elevate via their own per-job `permissions:` blocks below.
permissions:
  contents: read

jobs:
  # Validate that the tag matches the version in Cargo.toml
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract version from Cargo.toml
        id: cargo
        run: |
          version=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check version match
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          CARGO_VERSION: ${{ steps.cargo.outputs.version }}
        run: |
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

  # Validate that CHANGELOG.md has an entry for this version
  validate-changelog:
    name: Validate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check changelog entry
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain an entry for version $VERSION"
            echo "Expected to find: ## [$VERSION]"
            exit 1
          fi
          echo "Changelog entry found for version $VERSION"

  # Build binaries for all supported platforms
  # The tagged commit passes the unit tests and the lint gate before anything
  # is built or published from it.
  verify:
    name: Verify
    needs: [validate-version, validate-changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy
        run: cargo clippy --locked --workspace --lib --bins -- -D warnings

      - name: Unit tests
        run: cargo test --locked --workspace --exclude barbacane-test --lib --bins --tests

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: [validate-version, validate-changelog, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU targets
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Linux musl targets (static linking, requires cross for aws-lc-rs)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # macOS targets
          - target: x86_64-apple-darwin
            os: macos-15
            cross: false
          - target: aarch64-apple-darwin
            os: macos-15
            cross: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev a9301e91f72b

      - name: Build data plane with cargo
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }} --package barbacane

      - name: Build control plane with cargo
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }} --package barbacane-control

      - name: Build data plane with cross
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }} --package barbacane

      - name: Build control plane with cross
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }} --package barbacane-control

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/barbacane dist/barbacane-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/barbacane-control dist/barbacane-control-${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          retention-days: 1

  # Build container images per architecture using native runners
  build-containers:
    name: Build Containers (${{ matrix.platform }})
    needs: [validate-version, validate-changelog, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm  # Native ARM64 Linux runner
            suffix: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push data plane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/barbacane:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}
            docker.io/barbacane/barbacane:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=barbacane-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=barbacane-${{ matrix.suffix }}

      - name: Build and push control plane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.control
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/barbacane-control:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}
            docker.io/barbacane/barbacane-control:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=barbacane-control-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=barbacane-control-${{ matrix.suffix }}

      - name: Build and push standalone
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.standalone
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/barbacane-standalone:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}
            docker.io/barbacane/barbacane-standalone:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=barbacane-standalone-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=barbacane-standalone-${{ matrix.suffix }}

  # Create multi-arch manifests combining platform-specific images
  create-manifests:
    name: Create Multi-arch Manifests
    needs: [validate-version, build-containers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A pre-release (a version with a `-`, such as 1.0.0-rc.1) is published
      # under its own tag only, so latest, x.y and x stay on the last stable
      # release.
      - name: Create multi-arch manifests
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *-*) aliases="" ;;
            *) aliases="latest ${VERSION%.*} ${VERSION%%.*}" ;;
          esac
          for registry in "ghcr.io/$OWNER" docker.io/barbacane; do
            for image in barbacane barbacane-control barbacane-standalone; do
              tags=(-t "$registry/$image:$VERSION")
              for alias in $aliases; do
                tags+=(-t "$registry/$image:$alias")
              done
              echo "$registry/$image: $VERSION $aliases"
              docker buildx imagetools create "${tags[@]}" \
                "$registry/$image:$VERSION-amd64" \
                "$registry/$image:$VERSION-arm64"
            done
          done

  # Keyless (Sigstore) signing + CycloneDX SBOM attestation of the release images.
  sign-and-sbom:
    name: Sign & SBOM
    needs: [validate-version, create-manifests]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/sign-and-sbom.yml
    with:
      version: ${{ github.ref_name }}
    # Only the registry credentials it declares. GITHUB_TOKEN is provided to
    # called workflows automatically and does not need passing.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Security scan the multi-arch images
  scan-containers:
    name: Scan Containers
    needs: [validate-version, create-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Security scan images
      - name: Scan data plane image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/barbacane:${{ steps.tag.outputs.version }}
          format: 'sarif'
          output: 'trivy-data-plane.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan control plane image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/barbacane-control:${{ steps.tag.outputs.version }}
          format: 'sarif'
          output: 'trivy-control-plane.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload data plane scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-data-plane.sarif'
          category: 'trivy-data-plane'

      - name: Upload control plane scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-control-plane.sarif'
          category: 'trivy-control-plane'

      - name: Scan standalone image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/barbacane-standalone:${{ steps.tag.outputs.version }}
          format: 'sarif'
          output: 'trivy-standalone.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload standalone scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-standalone.sarif'
          category: 'trivy-standalone'

  # Publish crates to crates.io
  publish-crates:
    name: Publish Crates
    needs: [validate-version, validate-changelog, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Publish in dependency order (leaves first, roots last)
      # Wait between publishes for crates.io index to update
      # Track failures to report at the end
      - name: Publish all crates
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          FAILED=""
          SKIPPED=""
          SUCCESS=""

          publish_crate() {
            local crate=$1
            echo "::group::Publishing $crate"

            # Capture output and exit code
            set +e
            OUTPUT=$(cargo publish --locked -p "$crate" --token "$CARGO_REGISTRY_TOKEN" 2>&1)
            EXIT_CODE=$?
            set -e

            echo "$OUTPUT"

            if [ $EXIT_CODE -eq 0 ]; then
              echo "✓ $crate published successfully"
              SUCCESS="$SUCCESS $crate"
            elif echo "$OUTPUT" | grep -qE "already uploaded|already exists"; then
              echo "⊘ $crate already published, skipping"
              SKIPPED="$SKIPPED $crate"
            else
              echo "✗ $crate failed to publish"
              FAILED="$FAILED $crate"
            fi

            echo "::endgroup::"

            # Wait for crates.io index to update and avoid rate limits
            # New crate names have stricter limits than version updates
            sleep 60
          }

          # Publish in dependency order (leaves first).
          publish_crate "barbacane-plugin-macros"
          publish_crate "barbacane-plugin-sdk"
          publish_crate "barbacane-telemetry"
          publish_crate "barbacane-wasm"
          publish_crate "barbacane-compiler"
          publish_crate "barbacane"
          publish_crate "barbacane-control"

          # Summary
          echo ""
          echo "=========================================="
          echo "Publish Summary"
          echo "=========================================="

          if [ -n "$SUCCESS" ]; then
            echo "✓ Published:$SUCCESS"
          fi

          if [ -n "$SKIPPED" ]; then
            echo "⊘ Already published:$SKIPPED"
          fi

          if [ -n "$FAILED" ]; then
            echo "✗ Failed:$FAILED"
            echo ""
            echo "::error::Some crates failed to publish:$FAILED"
            exit 1
          fi

          echo ""
          echo "All crates published successfully!"

  # Build WASM plugins and collect artifacts for release
  build-plugins:
    name: Build Plugins
    needs: [validate-version, validate-changelog, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # No dependency cache. These plugins ship as release artifacts and are
      # signed, so their only inputs are the checked-out sources and the
      # lockfiles, not a cache another workflow can write to.
      - name: Build all plugins
        run: |
          mkdir -p dist/plugins
          for plugin_dir in plugins/*/; do
            if [ -f "$plugin_dir/Cargo.toml" ]; then
              name=$(basename "$plugin_dir")
              echo "::group::Building $name"
              (cd "$plugin_dir" && cargo build --locked --release --target wasm32-unknown-unknown)

              # Find the .wasm output (exclude deps)
              wasm_file=$(ls "$plugin_dir/target/wasm32-unknown-unknown/release/"*.wasm 2>/dev/null | grep -v deps | head -1)
              if [ -n "$wasm_file" ]; then
                cp "$wasm_file" "dist/plugins/$name.wasm"
                echo "  -> $name.wasm ($(du -h "dist/plugins/$name.wasm" | cut -f1))"
              else
                echo "::warning::No .wasm output found for $name"
              fi

              # Copy plugin.toml if present
              if [ -f "$plugin_dir/plugin.toml" ]; then
                cp "$plugin_dir/plugin.toml" "dist/plugins/$name.plugin.toml"
              fi

              echo "::endgroup::"
            fi
          done

      - name: Generate plugin checksums
        run: |
          cd dist/plugins
          sha256sum *.wasm > plugin-checksums.txt
          cat plugin-checksums.txt

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: dist/plugins/
          retention-days: 1

  # Create GitHub Release with all artifacts
  create-release:
    name: Create Release
    needs: [build-binaries, build-plugins, create-manifests, scan-containers, publish-crates, sign-and-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write      # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/binaries
          pattern: binaries-*
          merge-multiple: true

      - name: Download plugin artifacts
        uses: actions/download-artifact@v8
        with:
          name: plugins
          path: artifacts/plugins

      - name: Download image SBOMs
        uses: actions/download-artifact@v8
        with:
          path: artifacts/sboms
          pattern: sbom-*
          merge-multiple: true

      - name: Prepare release artifacts
        run: |
          mkdir -p artifacts/release

          # Binaries
          cp artifacts/binaries/* artifacts/release/

          # Plugins (.wasm and .plugin.toml files)
          cp artifacts/plugins/*.wasm artifacts/release/
          cp artifacts/plugins/*.plugin.toml artifacts/release/
          cp artifacts/plugins/plugin-checksums.txt artifacts/release/
          # The images' CycloneDX SBOMs, as attested on the images
          cp artifacts/sboms/*.cdx.json artifacts/release/

      - name: Generate checksums
        run: |
          cd artifacts/release
          # Checksums for binaries (plugins have their own file)
          binaries=$(ls barbacane-* barbacane-control-* 2>/dev/null || true)
          if [ -n "$binaries" ]; then
            sha256sum $binaries > checksums.txt
            cat checksums.txt
          else
            echo "::warning::No binary files found for checksums"
          fi

      # Every file of the release gets a signed provenance statement naming
      # this workflow run, verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/*

      - name: Extract release notes from changelog
        id: changelog
        run: |
          # Extract the body of this version's CHANGELOG section (everything after
          # the `## [VERSION]` header, up to the next `## [` section). A range like
          # /^## \[VERSION\]/,/^## \[/ does NOT work: the header line also matches
          # the end pattern, so the range collapses to a single line. Use a flag.
          VERSION=${{ steps.tag.outputs.version }}
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG entry found for $VERSION"
            exit 1
          fi
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Barbacane v${{ steps.tag.outputs.version }}
          body_path: release-notes.md
          files: |
            artifacts/release/*
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
