name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; jobs that push images / upload SARIF / create the
# release elevate via their own per-job `permissions:` blocks below.
permissions:
  contents: read

jobs:
  # Validate that the tag matches the version in Cargo.toml
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The whole history, to find the tagged commit on main.
          fetch-depth: 0

      # Every other job needs this one, so a `v*` tag on a commit that is not
      # on main publishes nothing.
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA, which $GITHUB_REF names, is not on main"
            exit 1
          fi

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract version from Cargo.toml
        id: cargo
        run: |
          version=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check version match
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          CARGO_VERSION: ${{ steps.cargo.outputs.version }}
        run: |
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

      # The workspace crates depend on each other by path with a version pin
      # for crates.io; a pin left behind fails `cargo publish` mid-sequence.
      - name: Check the intra-workspace version pins
        env:
          VERSION: ${{ steps.cargo.outputs.version }}
        run: |
          stale=$(grep -E '^barbacane[a-z0-9-]* = \{ path = ' Cargo.toml | grep -v "version = \"$VERSION\"" || true)
          if [ -n "$stale" ]; then
            echo "::error::workspace dependency pins do not match version $VERSION:"
            echo "$stale"
            exit 1
          fi

  # Validate that CHANGELOG.md has an entry for this version
  validate-changelog:
    name: Validate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Check changelog entry
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain an entry for version $VERSION"
            echo "Expected to find: ## [$VERSION]"
            exit 1
          fi
          echo "Changelog entry found for version $VERSION"

  # The one approval of a release. The `release-approval` environment has the
  # required reviewer; every job that publishes needs this one, so nothing is
  # pushed, signed or published before it is approved.
  approve:
    name: Approve Release
    needs: [validate-version, validate-changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-approval
    permissions: {}
    steps:
      - run: echo "Release $GITHUB_REF_NAME approved"

  # The tagged commit passed CI on main, which runs every test and lint gate,
  # and its dependencies still pass the supply-chain policy (an advisory may
  # have been published since CI ran). Waits for a CI run still in progress.
  preflight:
    name: Preflight
    needs: [validate-version, validate-changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: The tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main" \
              --jq '[.workflow_runs[] | {status, conclusion, url: .html_url}]')
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed on $GITHUB_SHA"
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo "::error::CI did not pass on $GITHUB_SHA:"
              jq -r '.[] | "  \(.conclusion) \(.url)"' <<<"$runs"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::no finished CI run on main for $GITHUB_SHA after an hour"
              exit 1
            fi
            sleep 60
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"

      - name: Install cargo-deny
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-deny@0.20.2

      - name: Supply-chain policy (advisories, licenses, bans, sources)
        run: |
          set -euo pipefail
          cargo deny check
          for manifest in plugins/*/Cargo.toml; do
            echo "::group::$manifest"
            cargo deny --manifest-path "$manifest" --config deny.toml check
            echo "::endgroup::"
          done

  # Every target, natively and with `cargo auditable`; release-binaries.yml
  # checks each binary and uploads it as `binaries-<target>`.
  build-binaries:
    name: Build Binaries
    needs: [validate-version, validate-changelog, preflight]
    permissions:
      contents: read
    uses: ./.github/workflows/release-binaries.yml

  # Build container images per architecture using native runners. No build
  # cache: the images are signed and published, so their only inputs are the
  # checked-out sources and the pinned base images, not a cache another
  # workflow can write to.
  build-containers:
    name: Build Containers (${{ matrix.platform }})
    needs: [validate-version, validate-changelog, preflight, approve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm  # Native ARM64 Linux runner
            suffix: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The `release` environment is where the publishing secrets belong.
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push data plane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/barbacane:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}
            docker.io/barbacane/barbacane:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}

      - name: Build and push control plane
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.control
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/barbacane-control:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}
            docker.io/barbacane/barbacane-control:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}

      - name: Build and push standalone
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.standalone
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/barbacane-standalone:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}
            docker.io/barbacane/barbacane-standalone:${{ steps.tag.outputs.version }}-${{ matrix.suffix }}

  # Create multi-arch manifests combining platform-specific images
  create-manifests:
    name: Create Multi-arch Manifests
    needs: [validate-version, build-containers, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The version's tag only: `latest`, `X.Y` and `X` move in Move Aliases,
      # once everything else has passed.
      - name: Create multi-arch manifests
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for registry in "ghcr.io/$OWNER" docker.io/barbacane; do
            for image in barbacane barbacane-control barbacane-standalone; do
              echo "$registry/$image:$VERSION"
              docker buildx imagetools create -t "$registry/$image:$VERSION" \
                "$registry/$image:$VERSION-amd64" \
                "$registry/$image:$VERSION-arm64"
            done
          done

  # Keyless (Sigstore) signing + CycloneDX SBOM attestation of the release images.
  sign-and-sbom:
    name: Sign & SBOM
    needs: [validate-version, create-manifests, approve]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/sign-and-sbom.yml
    with:
      version: ${{ github.ref_name }}
    # Only the registry credentials it declares, while they are repository
    # secrets; once they live in the `release` environment, the called job
    # reads them there. GITHUB_TOKEN is provided to called workflows
    # automatically and does not need passing.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Scans each multi-arch image with Grype. A vulnerability rated high or
  # critical that has a fix fails the release; every finding goes to code
  # scanning.
  scan-containers:
    name: Scan Containers (${{ matrix.image }})
    needs: [validate-version, create-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [barbacane, barbacane-control, barbacane-standalone]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.image }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.tag.outputs.version }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: sarif
          output-file: grype-${{ matrix.image }}.sarif

      - name: Upload scan results
        if: ${{ !cancelled() && hashFiles(format('grype-{0}.sarif', matrix.image)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype-${{ matrix.image }}.sarif
          category: grype-${{ matrix.image }}

  # A version on crates.io cannot be published again, so the crates go out
  # only once the binaries and plugins are built and the images are scanned
  # and signed.
  publish-crates:
    name: Publish Crates
    needs: [validate-version, validate-changelog, preflight, build-binaries, build-plugins, scan-containers, sign-and-sbom, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"

      # Publish in dependency order (leaves first, roots last)
      # Wait between publishes for crates.io index to update
      # Track failures to report at the end
      - name: Publish all crates
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          FAILED=""
          SKIPPED=""
          SUCCESS=""

          publish_crate() {
            local crate=$1
            echo "::group::Publishing $crate"

            # Capture output and exit code
            set +e
            OUTPUT=$(cargo publish --locked -p "$crate" --token "$CARGO_REGISTRY_TOKEN" 2>&1)
            EXIT_CODE=$?
            set -e

            echo "$OUTPUT"

            if [ $EXIT_CODE -eq 0 ]; then
              echo "✓ $crate published successfully"
              SUCCESS="$SUCCESS $crate"
            elif echo "$OUTPUT" | grep -qE "already uploaded|already exists"; then
              echo "⊘ $crate already published, skipping"
              SKIPPED="$SKIPPED $crate"
            else
              echo "✗ $crate failed to publish"
              FAILED="$FAILED $crate"
            fi

            echo "::endgroup::"

            # Wait for crates.io index to update and avoid rate limits
            # New crate names have stricter limits than version updates
            sleep 60
          }

          # Publish in dependency order (leaves first).
          publish_crate "barbacane-sigv4"
          publish_crate "barbacane-plugin-macros"
          publish_crate "barbacane-plugin-sdk"
          publish_crate "barbacane-telemetry"
          publish_crate "barbacane-wasm"
          publish_crate "barbacane-compiler"
          publish_crate "barbacane"
          publish_crate "barbacane-control"

          # Summary
          echo ""
          echo "=========================================="
          echo "Publish Summary"
          echo "=========================================="

          if [ -n "$SUCCESS" ]; then
            echo "✓ Published:$SUCCESS"
          fi

          if [ -n "$SKIPPED" ]; then
            echo "⊘ Already published:$SKIPPED"
          fi

          if [ -n "$FAILED" ]; then
            echo "✗ Failed:$FAILED"
            echo ""
            echo "::error::Some crates failed to publish:$FAILED"
            exit 1
          fi

          echo ""
          echo "All crates published successfully!"

  # Build WASM plugins and collect artifacts for release
  build-plugins:
    name: Build Plugins
    needs: [validate-version, validate-changelog, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown

      # No dependency cache. These plugins ship as release artifacts and are
      # signed, so their only inputs are the checked-out sources and the
      # lockfiles, not a cache another workflow can write to.
      - name: Build all plugins
        run: |
          mkdir -p dist/plugins
          for plugin_dir in plugins/*/; do
            if [ -f "$plugin_dir/Cargo.toml" ]; then
              name=$(basename "$plugin_dir")
              echo "::group::Building $name"
              (cd "$plugin_dir" && cargo build --locked --release --target wasm32-unknown-unknown)

              # Find the .wasm output (exclude deps)
              wasm_file=$(ls "$plugin_dir/target/wasm32-unknown-unknown/release/"*.wasm 2>/dev/null | grep -v deps | head -1)
              if [ -n "$wasm_file" ]; then
                cp "$wasm_file" "dist/plugins/$name.wasm"
                echo "  -> $name.wasm ($(du -h "dist/plugins/$name.wasm" | cut -f1))"
              else
                echo "::warning::No .wasm output found for $name"
              fi

              # Copy plugin.toml if present
              if [ -f "$plugin_dir/plugin.toml" ]; then
                cp "$plugin_dir/plugin.toml" "dist/plugins/$name.plugin.toml"
              fi

              echo "::endgroup::"
            fi
          done

      - name: Generate plugin checksums
        run: |
          cd dist/plugins
          sha256sum *.wasm > plugin-checksums.txt
          cat plugin-checksums.txt

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: dist/plugins/
          retention-days: 1

  # Create GitHub Release with all artifacts
  create-release:
    name: Create Release
    needs: [build-binaries, build-plugins, create-manifests, scan-containers, publish-crates, sign-and-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write      # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/binaries
          pattern: binaries-*
          merge-multiple: true

      - name: Download plugin artifacts
        uses: actions/download-artifact@v8
        with:
          name: plugins
          path: artifacts/plugins

      - name: Download image SBOMs
        uses: actions/download-artifact@v8
        with:
          path: artifacts/sboms
          pattern: sbom-*
          merge-multiple: true

      - name: Prepare release artifacts
        run: |
          mkdir -p artifacts/release

          # Binaries
          cp artifacts/binaries/* artifacts/release/

          # Plugins (.wasm and .plugin.toml files)
          cp artifacts/plugins/*.wasm artifacts/release/
          cp artifacts/plugins/*.plugin.toml artifacts/release/
          cp artifacts/plugins/plugin-checksums.txt artifacts/release/
          # The images' CycloneDX SBOMs, as attested on the images
          cp artifacts/sboms/*.cdx.json artifacts/release/

      - name: Generate checksums
        run: |
          cd artifacts/release
          # Checksums for binaries (plugins have their own file)
          binaries=$(ls barbacane-* barbacane-control-* 2>/dev/null || true)
          if [ -n "$binaries" ]; then
            sha256sum $binaries > checksums.txt
            cat checksums.txt
          else
            echo "::warning::No binary files found for checksums"
          fi

      # Every file of the release gets a signed provenance statement naming
      # this workflow run, verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/*

      - name: Extract release notes from changelog
        id: changelog
        run: |
          # Extract the body of this version's CHANGELOG section (everything after
          # the `## [VERSION]` header, up to the next `## [` section). A range like
          # /^## \[VERSION\]/,/^## \[/ does NOT work: the header line also matches
          # the end pattern, so the range collapses to a single line. Use a flag.
          VERSION=${{ steps.tag.outputs.version }}
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG entry found for $VERSION"
            exit 1
          fi
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Barbacane v${{ steps.tag.outputs.version }}
          body_path: release-notes.md
          files: |
            artifacts/release/*
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}

  # `latest`, `X.Y` and `X` move to a stable version last, once its images are
  # scanned and signed, its binaries, plugins and crates published and its
  # GitHub release created. A pre-release (a version with a `-`, such as
  # 1.0.0-rc.1) moves none. Each alias names the version's index by digest, so
  # its signatures and attestations apply to the alias.
  move-aliases:
    name: Move Aliases
    needs: [validate-version, approve, create-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Point latest, X.Y and X at the version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          aliases=(latest "${VERSION%.*}" "${VERSION%%.*}")
          for registry in "ghcr.io/$OWNER" docker.io/barbacane; do
            for image in barbacane barbacane-control barbacane-standalone; do
              source="$registry/$image:$VERSION"
              digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')
              tags=()
              for alias in "${aliases[@]}"; do
                tags+=(-t "$registry/$image:$alias")
              done
              echo "$registry/$image: ${aliases[*]} -> $VERSION ($digest)"
              docker buildx imagetools create "${tags[@]}" "$registry/$image@$digest"
              for alias in "${aliases[@]}"; do
                moved=$(docker buildx imagetools inspect "$registry/$image:$alias" --format '{{.Manifest.Digest}}')
                if [ "$moved" != "$digest" ]; then
                  echo "::error::$registry/$image:$alias is $moved, not $VERSION's $digest"
                  exit 1
                fi
              done
            done
          done
