# Runs the parser's differential checks over published specs, which are too
# large to keep in the repository (25 MB against a 19 MB .git) and change on
# their own schedule. Informational: it reports when a real document starts
# failing, and is not a merge gate.
#
# This is the only workflow that runs the `corpus` test target: the pull request
# suite runs `cargo test --workspace --lib --bins`, which does not build
# integration test targets.
name: Spec Corpus

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: Published specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Four of the eleven corpus checks compile a fixture through a plugin, and
      # a missing .wasm fails the compile rather than the check. Its own cache
      # key: this builds a subset, and saving that under the key the pull request
      # workflow uses would hand a later `make plugins` a cache hit for plugins
      # it has not built.
      - name: Cache the plugins the corpus checks compile against
        uses: actions/cache@v5
        with:
          path: |
            plugins/*/*.wasm
            plugins/mock/target
            plugins/rate-limit/target
            plugins/basic-auth/target
            plugins/ai-proxy/target
          key: ${{ runner.os }}-corpus-plugins-${{ hashFiles('plugins/mock/**/*.rs', 'plugins/rate-limit/**/*.rs', 'plugins/basic-auth/**/*.rs', 'plugins/ai-proxy/**/*.rs', 'plugins/*/Cargo.lock', 'crates/barbacane-plugin-sdk/**') }}
          restore-keys: |
            ${{ runner.os }}-corpus-plugins-

      - name: Build them
        run: |
          set -euo pipefail
          for plugin in mock rate-limit basic-auth ai-proxy; do
            (cd "plugins/$plugin" && cargo build --release --target wasm32-unknown-unknown)
            # The crate name is not the directory name, so glob for it. Exactly
            # one artifact is expected; cp rejects more than one.
            built=("plugins/$plugin/target/wasm32-unknown-unknown/release/"*.wasm)
            cp "${built[@]}" "plugins/$plugin/$plugin.wasm"
            echo "  $plugin.wasm ($(du -h "plugins/$plugin/$plugin.wasm" | cut -f1))"
          done

      - name: Fetch published specs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corpus"
          cd "$RUNNER_TEMP/corpus"
          # Each is a spec its publisher maintains, so a failure here is either
          # our bug or a construct we do not handle yet. Fetching rather than
          # vendoring keeps 25 MB out of the repository and follows upstream.
          fetch() {
            curl -fsSL --retry 3 --max-time 120 -o "$1" "$2" \
              && echo "  fetched $1 ($(du -h "$1" | cut -f1))" \
              || echo "::warning::could not fetch $1, skipping"
          }
          fetch petstore.json   https://petstore3.swagger.io/api/v3/openapi.json
          fetch stripe.json     https://raw.githubusercontent.com/stripe/openapi/master/openapi/spec3.json
          fetch github.json     https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json
          fetch box.json        https://raw.githubusercontent.com/box/box-openapi/main/openapi.json
          fetch asana.yaml      https://raw.githubusercontent.com/Asana/openapi/master/defs/asana_oas.yaml
          fetch asyncapi-streetlights.yml https://raw.githubusercontent.com/asyncapi/spec/master/examples/streetlights-kafka-asyncapi.yml
          fetch asyncapi-websocket.yml    https://raw.githubusercontent.com/asyncapi/spec/master/examples/websocket-gemini-asyncapi.yml
          # Kubernetes publishes its 3.0 description per API group. The core
          # group alone carries 113 paths whose schemas reference each other
          # heavily, which is the shape that breaks a resolver. Its top-level
          # swagger.json is 2.0 and is deliberately not used.
          k8s=https://raw.githubusercontent.com/kubernetes/kubernetes/master/api/openapi-spec/v3
          fetch k8s-core.json  "$k8s/api__v1_openapi.json"
          fetch k8s-apps.json  "$k8s/apis__apps__v1_openapi.json"
          fetch k8s-batch.json "$k8s/apis__batch__v1_openapi.json"
          fetch k8s-rbac.json  "$k8s/apis__rbac.authorization.k8s.io__v1_openapi.json"
          ls -1

      - name: Run the corpus checks over them
        env:
          BARBACANE_CORPUS_DIR: ${{ runner.temp }}/corpus
        run: cargo test -p barbacane-compiler --test corpus -- --nocapture
