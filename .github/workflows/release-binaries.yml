name: Release binaries

# Builds `barbacane` and `barbacane-control` for every release target with
# `cargo auditable`, on a runner of the target's architecture, and checks each
# binary: it carries the list of crates it was built from, a musl binary is
# statically linked, and a binary for the runner's own architecture runs. The
# release calls it; a pull request that changes it runs it too.

on:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/release-binaries.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Static, with musl-gcc for the C dependencies (aws-lc, lz4, zstd).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      MUSL: ${{ matrix.musl || false }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}

      - name: Install musl-gcc
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # `cargo auditable` embeds the crate list; `rust-audit-info` reads it back.
      - name: Install cargo-auditable and rust-audit-info
        run: cargo install --locked cargo-auditable@0.7.7 rust-audit-info@0.5.4

      # One package per build, so neither binary gets features only the other
      # enables.
      - name: Build
        run: |
          set -euo pipefail
          if [ "$MUSL" = true ]; then
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          for package in barbacane barbacane-control; do
            cargo auditable build --locked --release --target "$TARGET" --package "$package"
          done

      - name: Check the binaries
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) native=x86_64 ;;
            arm64 | aarch64) native=aarch64 ;;
            *) native=none ;;
          esac
          for bin in barbacane barbacane-control; do
            path="target/$TARGET/release/$bin"
            crates=$(rust-audit-info "$path" | jq '.packages | length')
            echo "$bin: $crates crates recorded"
            [ "$crates" -gt 0 ]
            if [ "$MUSL" = true ]; then
              file "$path"
              file "$path" | grep -E -q 'statically linked|static-pie linked'
            fi
            if [ "${TARGET%%-*}" = "$native" ]; then
              "$path" --version
            fi
          done

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/barbacane" "dist/barbacane-$TARGET"
          cp "target/$TARGET/release/barbacane-control" "dist/barbacane-control-$TARGET"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist/
          retention-days: 1
