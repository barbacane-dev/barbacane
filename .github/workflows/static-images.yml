name: Scratch images (prototype)

# Prototype for #397: the binaries on scratch with Debian 13's glibc and
# libgcc and their dpkg records. Builds both images and checks their contents
# and what a scanner sees in them, runs the integration suites against the
# images' binaries, and compares the gateway image with today's under load.

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.control
      - docker/scratch-rootfs.sh
      - .github/workflows/static-images.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: barbacane
            file: Dockerfile
            binary: barbacane
            path: /barbacane
          - image: barbacane-control
            file: Dockerfile.control
            binary: barbacane-control
            path: /usr/local/bin/barbacane-control
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Export the binary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./${{ matrix.file }}
          target: binary
          outputs: type=local,dest=bin

      # Same builder, so the build stage comes from its cache.
      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./${{ matrix.file }}
          load: true
          tags: ${{ matrix.image }}:scratch

      - name: Check the binary and the image's contents
        env:
          IMAGE: ${{ matrix.image }}:scratch
          BINARY: bin/${{ matrix.binary }}
          IN_IMAGE: ${{ matrix.path }}
        run: |
          set -euo pipefail
          file "$BINARY"
          ls -l "$BINARY"
          readelf -d "$BINARY" | grep NEEDED
          docker run --rm --entrypoint "$IN_IMAGE" "$IMAGE" --version
          docker image inspect "$IMAGE" --format 'image size: {{.Size}} bytes'
          container=$(docker create "$IMAGE")
          docker export "$container" | tar -tv --numeric-owner | tee contents.txt
          docker rm "$container" >/dev/null
          awk -v binary="${IN_IMAGE#/}" '
            { total += $3 }
            $6 == binary { bin = $3 }
            $6 ~ /\/gconv\// { gconv += $3 }
            END { printf "bytes: %d in all, %d the binary, %d gconv modules, %d the rest\n", total, bin, gconv, total - bin - gconv }
          ' contents.txt
          grep -E ' 65532/65532 .* home/nonroot/$' contents.txt
          grep -E '^drwxrwxrwt .* tmp/$' contents.txt
          grep -E ' etc/ssl/certs/ca-certificates.crt$' contents.txt
          grep -E ' etc/nsswitch.conf$' contents.txt
          grep -E ' var/lib/dpkg/status$' contents.txt
          grep -E ' etc/os-release -> ' contents.txt
          if grep -qE ' (usr/)?s?bin/.' contents.txt; then
            echo "the image holds programs other than the binary" >&2
            exit 1
          fi

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # A scanner sees glibc and libgcc through the dpkg records and the
      # crates through the list `cargo auditable` embeds in the binary.
      - name: What a scanner sees
        env:
          IMAGE: ${{ matrix.image }}:scratch
        run: |
          set -euo pipefail
          syft scan "docker:$IMAGE" -o json > sbom.json
          jq -r '"distro: \(.distro.id) \(.distro.versionID)"' sbom.json
          jq -r '.artifacts | group_by(.type) | map("\(.[0].type): \(length)") | .[]' sbom.json
          jq -r '.artifacts[] | select(.type == "deb") | "deb: \(.name) \(.version)"' sbom.json
          [ "$(jq -r '.distro.id' sbom.json)" = debian ]
          [ "$(jq -r '.distro.versionID' sbom.json)" = 13 ]
          for package in libc6 libgcc-s1; do
            jq -e --arg p "$package" 'any(.artifacts[]; .type == "deb" and .name == $p)' sbom.json > /dev/null \
              || { echo "Syft does not see $package in $IMAGE" >&2; exit 1; }
          done
          crates=$(jq '[.artifacts[] | select(.type == "rust-crate")] | length' sbom.json)
          echo "Rust crates: $crates"
          if [ "$crates" -lt 100 ]; then
            echo "Syft sees $crates crates in $IMAGE" >&2
            exit 1
          fi

      # The scan the release runs.
      - name: Scan ${{ matrix.image }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.image }}:scratch
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table

      # Every match, unfixed and low ones included: what a user's scanner lists.
      - name: Every match in ${{ matrix.image }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.image }}:scratch
          severity-cutoff: negligible
          only-fixed: false
          fail-build: false
          output-format: table

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: scratch-${{ matrix.binary }}
          path: bin/${{ matrix.binary }}
          retention-days: 3

      - name: Save the gateway image
        if: matrix.image == 'barbacane'
        run: docker save barbacane:scratch | gzip > image.tar.gz

      - name: Upload the gateway image
        if: matrix.image == 'barbacane'
        uses: actions/upload-artifact@v7
        with:
          name: image-barbacane
          path: image.tar.gz
          retention-days: 3

  # The integration suite of CI's integration-tests job, run against the
  # image's gateway binary. Caches are restored only: the jobs place that
  # binary where cargo builds its own, and must not save it.
  integration:
    name: Integration Tests, image binary (shard ${{ matrix.shard }})
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 4
      BARBACANE_TEST_LDAP_URL: ldap://127.0.0.1:3893
    services:
      ldap:
        image: ghcr.io/glauth/glauth:v2.5.4
        ports:
          - 3893:3893
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown

      - name: Restore cargo cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore WASM plugins
        uses: actions/cache/restore@v5
        id: plugin-cache
        with:
          path: |
            plugins/*/*.wasm
            plugins/*/target
          key: ${{ runner.os }}-plugins-${{ hashFiles('plugins/**/Cargo.toml', 'plugins/**/Cargo.lock', 'plugins/**/*.rs', 'plugins/**/plugin.toml', 'plugins/**/config-schema.json', 'crates/barbacane-plugin-sdk/**') }}

      - name: Build WASM plugins
        if: steps.plugin-cache.outputs.cache-hit != 'true'
        run: make plugins

      - name: Download the image's gateway
        uses: actions/download-artifact@v8
        with:
          name: scratch-barbacane
          path: bin

      - name: Point the harness at it
        run: |
          chmod +x bin/barbacane
          echo "BARBACANE_TEST_BINARY=$PWD/bin/barbacane" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: |
          all=$(ls crates/barbacane-test/tests/*.rs \
            | xargs -n1 basename | sed 's/\.rs$//' \
            | grep -vxE 'security|control_cli|connected_mode' | sort)
          targets=$(echo "$all" \
            | awk "NR % $SHARD_TOTAL == $SHARD_INDEX" \
            | sed 's/^/--test /' | tr '\n' ' ')
          lib=""; [ "$SHARD_INDEX" = "0" ] && lib="--lib"
          if [ -z "$targets" ] && [ -z "$lib" ]; then
            echo "No targets for shard $SHARD_INDEX"; exit 0
          fi
          echo "Shard $SHARD_INDEX/$SHARD_TOTAL targets: $lib $targets"
          cargo test --locked -p barbacane-test $lib $targets --no-fail-fast -- --test-threads=2

  # CI's security-suite job with both images' binaries: the control plane on
  # PostgreSQL, the CLI against it, and a gateway in connected mode.
  security-suite:
    name: Security Suite, image binaries
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: barbacane
          POSTGRES_PASSWORD: barbacane
          POSTGRES_DB: barbacane
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://barbacane:barbacane@localhost:5432/barbacane
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown

      - name: Restore cargo cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore WASM plugins
        uses: actions/cache/restore@v5
        id: plugin-cache
        with:
          path: |
            plugins/*/*.wasm
            plugins/*/target
          key: ${{ runner.os }}-plugins-${{ hashFiles('plugins/**/Cargo.toml', 'plugins/**/Cargo.lock', 'plugins/**/*.rs', 'plugins/**/plugin.toml', 'plugins/**/config-schema.json', 'crates/barbacane-plugin-sdk/**') }}

      - name: Build WASM plugins
        if: steps.plugin-cache.outputs.cache-hit != 'true'
        run: make plugins

      - name: Download the images' binaries
        uses: actions/download-artifact@v8
        with:
          pattern: scratch-*
          path: bin
          merge-multiple: true

      # control_cli and connected_mode look for both binaries in target/debug.
      - name: Point the harness at them
        run: |
          chmod +x bin/barbacane bin/barbacane-control
          mkdir -p target/debug
          cp bin/barbacane bin/barbacane-control target/debug/
          echo "BARBACANE_TEST_BINARY=$PWD/bin/barbacane" >> "$GITHUB_ENV"

      - name: Run security suite
        run: cargo test --locked -p barbacane-test --test security -- --test-threads=2

      - name: Run the control CLI and connected-mode tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p barbacane-test --test control_cli --test connected_mode -- --test-threads=2

  # Today's gateway image (main's Dockerfile) against the scratch one, both
  # with the gateway built by Rust 1.95 from this commit and both run as
  # containers on the host network. Three alternating rounds per image, on a
  # mock route and on a route proxying to an upstream in today's image, with
  # the global middlewares cors and correlation-id.
  load:
    name: Load comparison (today, scratch)
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build today's gateway image
        run: |
          set -euo pipefail
          git fetch --depth 1 origin main
          git show FETCH_HEAD:Dockerfile > Dockerfile.today
          docker buildx build --load -t barbacane:today -f Dockerfile.today .

      # What a user's scanner lists in today's image, to set against the
      # scratch image's list in the image job.
      - name: Every match in today's image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: barbacane:today
          severity-cutoff: negligible
          only-fixed: false
          fail-build: false
          output-format: table

      - name: Download the scratch image
        uses: actions/download-artifact@v8
        with:
          name: image-barbacane
          path: image

      - name: Download the scratch image's binary
        uses: actions/download-artifact@v8
        with:
          name: scratch-barbacane
          path: bin

      - name: Load the scratch image
        run: |
          gunzip -c image/image.tar.gz | docker load
          docker image ls barbacane

      # Each image with the other's binary, to tell the runtime files from
      # the build: today's binary is built by `cargo build`, the scratch
      # image's by `cargo auditable build`.
      - name: Cross the binaries and the runtimes
        run: |
          set -euo pipefail
          mkdir -p cross/plain cross/auditable
          container=$(docker create barbacane:today)
          docker cp "$container:/barbacane" cross/plain/barbacane
          docker rm "$container" > /dev/null
          cp bin/barbacane cross/auditable/barbacane
          chmod 755 cross/plain/barbacane cross/auditable/barbacane
          cross() {
            printf 'FROM %s\nCOPY barbacane /barbacane\n' "$1" \
              | docker buildx build --builder default --load -t "$2" -f - "$3"
          }
          cross barbacane:today barbacane:today-auditable cross/auditable
          cross barbacane:scratch barbacane:scratch-plain cross/plain
          docker image ls barbacane

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown

      - name: Restore WASM plugins
        uses: actions/cache/restore@v5
        id: plugin-cache
        with:
          path: |
            plugins/*/*.wasm
            plugins/*/target
          key: ${{ runner.os }}-plugins-${{ hashFiles('plugins/**/Cargo.toml', 'plugins/**/Cargo.lock', 'plugins/**/*.rs', 'plugins/**/plugin.toml', 'plugins/**/config-schema.json', 'crates/barbacane-plugin-sdk/**') }}

      - name: Build the plugins the benchmark uses
        if: steps.plugin-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for name in mock http-upstream cors correlation-id; do
            (cd "plugins/$name" && cargo build --locked --release --target wasm32-unknown-unknown)
            cp "$(ls "plugins/$name/target/wasm32-unknown-unknown/release/"*.wasm | head -1)" \
              "plugins/$name/$name.wasm"
          done

      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      - name: Compare
        run: |
          set -euo pipefail
          chmod +x bin/barbacane
          mkdir -p bench
          cat > bench/barbacane.yaml <<'EOF'
          plugins:
            mock:
              path: ../plugins/mock/mock.wasm
            http-upstream:
              path: ../plugins/http-upstream/http-upstream.wasm
            cors:
              path: ../plugins/cors/cors.wasm
            correlation-id:
              path: ../plugins/correlation-id/correlation-id.wasm
          EOF
          cat > bench/api.yaml <<'EOF'
          openapi: "3.1.0"
          info:
            title: Load comparison
            version: "1.0.0"
          x-barbacane-middlewares:
            - name: correlation-id
              config: {}
            - name: cors
              config:
                allowed_origins: ["https://example.com"]
          paths:
            /mock:
              get:
                operationId: mock
                x-barbacane-dispatch:
                  name: mock
                  config:
                    status: 200
                    body: '{"status":"ok","items":[1,2,3,4,5,6,7,8]}'
                responses:
                  "200":
                    description: OK
            /proxy:
              get:
                operationId: proxy
                x-barbacane-dispatch:
                  name: http-upstream
                  config:
                    url: "http://127.0.0.1:18081"
                    path: "/mock"
                responses:
                  "200":
                    description: OK
            /proxy-by-name:
              get:
                operationId: proxyByName
                x-barbacane-dispatch:
                  name: http-upstream
                  config:
                    url: "http://localhost:18081"
                    path: "/mock"
                responses:
                  "200":
                    description: OK
            /external:
              get:
                operationId: external
                x-barbacane-dispatch:
                  name: http-upstream
                  config:
                    url: "https://example.com"
                    path: "/"
                responses:
                  "200":
                    description: OK
          EOF
          bin/barbacane compile --spec bench/api.yaml --manifest bench/barbacane.yaml \
            --output bench/api.bca --allow-plaintext
          chmod 644 bench/api.bca

          # serve <image> <port>: starts a gateway container and sets $cid.
          serve() {
            # The proxied routes reach a loopback upstream, which the SSRF guard
            # refuses unless internal egress is allowed.
            cid=$(docker run -d --network host -e BARBACANE_ALLOW_INTERNAL_EGRESS=1 \
              -v "$PWD/bench:/bench:ro" "$1" \
              serve --artifact /bench/api.bca --listen "127.0.0.1:$2" --admin-bind off \
              --allow-unsigned --allow-plaintext-upstream --log-level error)
            for _ in $(seq 1 150); do
              curl -fsS -o /dev/null "http://127.0.0.1:$2/mock" && return 0
              sleep 0.2
            done
            docker logs "$cid" >&2
            echo "$1 did not answer on $2" >&2
            exit 1
          }
          status() { curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$1"; }

          serve barbacane:today 18081
          upstream=$cid

          : > bench/results.tsv
          for round in 1 2 3; do
            for label in today today-auditable scratch-plain scratch; do
              serve "barbacane:$label" 18080
              gateway=$cid
              # A hostname resolved through the image's libc, and a public
              # host over TLS: both must answer.
              for route in /proxy /proxy-by-name /external; do
                code=$(status "$route")
                echo "$label $route: $code"
                [ "$code" = 200 ]
              done
              for route in mock proxy; do
                url="http://127.0.0.1:18080/$route"
                wrk -t2 -c64 -d5s -H 'Origin: https://example.com' "$url" > /dev/null
                wrk -t2 -c64 -d20s --latency -H 'Origin: https://example.com' "$url" \
                  > "bench/$label-$route-$round.txt"
                printf '%s\t%s\t%s\t%s\n' "$label" "$route" "$round" "bench/$label-$route-$round.txt" >> bench/results.tsv
              done
              pid=$(docker inspect -f '{{.State.Pid}}' "$gateway")
              printf '%s\trss\t%s\t%s\n' "$label" "$round" \
                "$(awk '/^VmHWM/ {print $2}' "/proc/$pid/status")" >> bench/results.tsv
              echo "$label round $round: $(docker logs "$gateway" 2>&1 | grep -c 'HTTP call failed' || true) failed upstream calls logged"
              docker stop "$gateway" > /dev/null
              docker rm "$gateway" > /dev/null
            done
          done
          docker stop "$upstream" > /dev/null

          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import re, statistics
          from collections import defaultdict

          def ms(text):
              value, unit = re.fullmatch(r"([\d.]+)(us|ms|s)", text).groups()
              return float(value) * {"us": 0.001, "ms": 1.0, "s": 1000.0}[unit]

          runs = defaultdict(lambda: defaultdict(list))
          for line in open("bench/results.tsv"):
              label, kind, round_, value = line.rstrip("\n").split("\t")
              if kind == "rss":
                  runs[label]["peak RSS (MiB)"].append(int(value) / 1024)
                  continue
              out = open(value).read()
              runs[label][f"{kind} req/s"].append(float(re.search(r"Requests/sec:\s+([\d.]+)", out).group(1)))
              # Failed requests: non-2xx answers and socket errors.
              failed = re.search(r"Non-2xx or 3xx responses:\s+(\d+)", out)
              sockets = re.search(r"Socket errors: connect (\d+), read (\d+), write (\d+), timeout (\d+)", out)
              runs[label][f"{kind} failed"].append(
                  (int(failed.group(1)) if failed else 0)
                  + (sum(map(int, sockets.groups())) if sockets else 0)
              )
              for pct in ("50", "99"):
                  latency = re.search(rf"^\s+{pct}%\s+(\S+)", out, re.M).group(1)
                  runs[label][f"{kind} p{pct} (ms)"].append(ms(latency))

          # today: Chainguard runtime, `cargo build`; scratch: Debian runtime,
          # `cargo auditable build`; the other two cross them.
          labels = ["today", "today-auditable", "scratch-plain", "scratch"]
          metrics = list(runs["today"])
          print("### Runtime files and build against today's image (median of 3 rounds, ratio to today)\n")
          print("| metric | " + " | ".join(labels) + " |")
          print("|---" * (len(labels) + 1) + "|")
          for metric in metrics:
              t = statistics.median(runs["today"][metric])
              cells = []
              for label in labels:
                  v = statistics.median(runs[label][metric])
                  cells.append(f"{v:.2f}" + (f" ({v / t:.2f})" if t and label != "today" else ""))
              print(f"| {metric} | " + " | ".join(cells) + " |")
          print("\nEvery round:\n")
          for label in labels:
              for metric in metrics:
                  values = ", ".join(f"{v:.2f}" for v in runs[label][metric])
                  print(f"- {label}, {metric}: {values}")
          EOF

      - name: Upload the wrk outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: load-comparison
          path: bench/
          retention-days: 7
