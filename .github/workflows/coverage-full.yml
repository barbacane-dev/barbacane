name: Coverage (full)

# The full instrumented coverage run: unit + integration (the gateway driven as
# an instrumented child process) + the control-plane tests over a real
# PostgreSQL. It is heavy (~35 min), so it runs on main, nightly, and on demand
# rather than on every pull request. The enforced floor lives here; the
# per-pull-request CI job runs a fast unit-only report instead.

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'plugins/**'
      - 'scripts/coverage.sh'
      - '.github/workflows/coverage-full.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-full:
    name: Coverage (full)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: barbacane
          POSTGRES_PASSWORD: barbacane
          POSTGRES_DB: barbacane
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # glauth with its built-in default directory, for tests/ldap.rs.
      ldap:
        image: ghcr.io/glauth/glauth:v2.5.4
        ports:
          - 3893:3893
      # A single-node Kafka with its default configuration, for tests/kafka.rs.
      kafka:
        image: apache/kafka-native:4.4.0
        ports:
          - 9092:9092
    env:
      DATABASE_URL: postgres://barbacane:barbacane@localhost:5432/barbacane
      BARBACANE_TEST_LDAP_URL: ldap://127.0.0.1:3893
      BARBACANE_TEST_KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview

      # The key carries the compiler: instrumented objects left by another
      # compiler (or another `target/` layout) are not removed by
      # `cargo llvm-cov clean`, and the report counts them as code that never
      # ran. A new compiler starts from an empty `target/`.
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-${{ steps.toolchain.outputs.cachekey }}-

      - name: Build WASM plugins
        run: make plugins

      # The control plane's `sslmode` tests need a PostgreSQL that serves TLS.
      - name: Start PostgreSQL with TLS
        run: ./scripts/postgres-tls.sh >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-llvm-cov@0.9.1

      # Raise the floor when the real number rises. Never lower it to turn a
      # red build green.
      - name: Measure coverage
        run: ./scripts/coverage.sh --lcov lcov.info --summary coverage.txt --floor 63

      - name: Publish summary
        if: always()
        run: |
          {
            echo '### Coverage (full)'
            echo
            echo '```'
            cat coverage.txt || echo '(no summary produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  # A failed run that no pull request shows opens or updates an issue.
  report-failure:
    name: Report failure
    needs: [coverage-full]
    if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'push') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/report-failure.yml
