name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'plugins/*/config-schema.json'
      - 'book.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Only the deploy job needs the Pages and OIDC tokens; the build job runs
# mdbook over repository content and needs nothing but the checkout.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.5.4'

      - name: Build documentation
        run: mdbook build

      - name: Copy vacuum ruleset and plugin schemas to output
        run: |
          cp -r docs/rulesets book/rulesets
          mkdir -p book/rulesets/schemas
          for schema in plugins/*/config-schema.json; do
            name=$(basename "$(dirname "$schema")")
            cp "$schema" "book/rulesets/schemas/${name}.json"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './book'

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
