name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'plugins/*/config-schema.json'
      - 'book.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Only the deploy job needs the Pages and OIDC tokens; the build job runs
# mdbook over repository content and needs nothing but the checkout.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Full history so the sitemap can use each page's real last-commit date.
          fetch-depth: 0

      - name: Setup mdBook
        # Pinned to the post-v2.0.0 main commit that moved the action to the
        # node24 runtime (peaceiris/actions-mdbook#539); v2.0.0 still ships node20.
        uses: peaceiris/actions-mdbook@a6f333f62c4b46ed5190d00cab3b7f9a6996274c
        with:
          mdbook-version: '0.5.4'

      - name: Build documentation
        run: mdbook build

      - name: Copy vacuum ruleset and plugin schemas to output
        run: |
          cp -r docs/rulesets book/rulesets
          mkdir -p book/rulesets/schemas
          for schema in plugins/*/config-schema.json; do
            name=$(basename "$(dirname "$schema")")
            cp "$schema" "book/rulesets/schemas/${name}.json"
          done

      - name: Generate sitemap.xml and robots.txt
        run: |
          BASE="https://docs.barbacane.dev"
          DATE="$(date -u +%Y-%m-%d)"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find book -type f -name '*.html' ! -name 'print.html' ! -name '404.html' \
              | sort | while read -r f; do
                rel="${f#book/}"
                loc="$BASE/$rel"
                loc="${loc%index.html}"
                # lastmod is the source page's last commit date, so unchanged
                # pages keep a stable date instead of looking modified every build.
                src="docs/${rel%.html}.md"
                lastmod=""
                if [ -f "$src" ]; then
                  lastmod="$(git log -1 --format=%cs -- "$src" 2>/dev/null || true)"
                fi
                [ -n "$lastmod" ] || lastmod="$DATE"
                echo "  <url><loc>${loc}</loc><lastmod>${lastmod}</lastmod></url>"
              done
            echo '</urlset>'
          } > book/sitemap.xml
          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "$BASE" > book/robots.txt
          echo "sitemap: $(grep -c '<url>' book/sitemap.xml) urls"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './book'

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
