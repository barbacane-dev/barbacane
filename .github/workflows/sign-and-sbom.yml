name: Sign & SBOM

# Keyless (Sigstore/Fulcio) signing + CycloneDX SBOM attestation for the release
# container images. Identity is the GitHub Actions OIDC token — no long-lived
# signing keys (#87, option A).
#
# Called only by release.yml, from a `v*` tag, after the multi-arch manifests
# exist. The certificate names this file at that tag, which is the identity
# docs/reference/configuration.md tells users to verify. To sign again, re-run
# the release's Sign & SBOM job.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to sign (with or without a leading v)"
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  packages: write      # push signatures/attestations to GHCR
  id-token: write       # OIDC token for keyless signing

jobs:
  sign:
    name: Sign & SBOM (${{ matrix.image }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environment secrets, when the `release` environment holds the Docker Hub
    # credentials, take the place of those the caller passes.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        image: [barbacane, barbacane-control, barbacane-standalone]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Sign images and attest SBOMs (keyless)
        env:
          IMAGE: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          COSIGN_YES: "true"
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION}"
          VERSION="${VERSION#v}"   # tolerate a leading v

          for ref in "ghcr.io/${OWNER}/${IMAGE}" "docker.io/barbacane/${IMAGE}"; do
            # By DIGEST (never by a mutable tag): the multi-arch index and,
            # with --recursive, the image of each platform in it, which is
            # what a runtime pulls and an admission policy verifies.
            index="$(docker buildx imagetools inspect "${ref}:${VERSION}" --format '{{.Manifest.Digest}}')"
            echo "::group::${ref}@${index}"
            echo "cosign sign --recursive ${ref}@${index}"
            cosign sign --recursive "${ref}@${index}"

            # One SBOM per architecture, attested to that platform's image and
            # to the index, where `cosign verify-attestation` on the tag finds it.
            raw="$(docker buildx imagetools inspect "${ref}:${VERSION}" --raw)"
            for arch in amd64 arm64; do
              platform="$(jq -r --arg arch "$arch" \
                '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)][0].digest // empty' <<<"$raw")"
              if [ -z "$platform" ]; then
                echo "::error::${ref}:${VERSION} has no linux/${arch} image"
                exit 1
              fi
              sbom="sbom-${IMAGE}-${arch}.cdx.json"
              echo "syft SBOM (CycloneDX) for ${ref}@${platform} (linux/${arch})"
              syft "${ref}@${platform}" -o cyclonedx-json > "$sbom"
              cosign attest --predicate "$sbom" --type cyclonedx "${ref}@${platform}"
              cosign attest --predicate "$sbom" --type cyclonedx "${ref}@${index}"
            done
            echo "::endgroup::"
          done

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}-*.cdx.json
          retention-days: 30
