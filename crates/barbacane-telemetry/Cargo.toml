[package]
name = "barbacane-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Observability infrastructure for Barbacane API Gateway"

[dependencies]
# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# OpenTelemetry
opentelemetry = { workspace = true }
# The gRPC exporter runs on tonic, which needs the Tokio runtime the batch
# processor gets from this feature.
opentelemetry_sdk = { workspace = true, features = ["experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Metrics
prometheus-client = { workspace = true }

# Utilities
uuid = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
