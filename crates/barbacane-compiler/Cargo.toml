[package]
name = "barbacane-compiler"
description = "Compiles OpenAPI/AsyncAPI specs into .bca artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
parapet.workspace = true
chrono = { workspace = true }
hex = { workspace = true }
home = "0.5"
ring = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
# Proves a parsed schema is usable by the data plane's validator, which builds
# a jsonschema::Validator from it.
jsonschema = { workspace = true }
# The corpus test reads specs and computes what it expects from them itself.
serde_yaml = { workspace = true }

[[bench]]
name = "compilation"
harness = false
