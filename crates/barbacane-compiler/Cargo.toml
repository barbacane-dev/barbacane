[package]
name = "barbacane-compiler"
description = "Compiles OpenAPI/AsyncAPI specs into .bca artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Plugin configurations are validated against the schema each plugin publishes
# (E1023), so this is needed by the compiler itself and not only by tests.
jsonschema = { workspace = true }
parapet.workspace = true
chrono = { workspace = true }
hex = { workspace = true }
home = "0.5"
ring = { workspace = true }
base64 = { workspace = true }
wasmparser = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
wat = { workspace = true }
# `compile` runs inside a runtime; the download tests reproduce that context.
tokio = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
# Proves a parsed schema is usable by the data plane's validator, which builds
# a jsonschema::Validator from it.
jsonschema = { workspace = true }
# libyaml, the reference the YAML module is compared with.
yaml_serde = { workspace = true }

[[bench]]
name = "compilation"
harness = false

[[bench]]
name = "yaml"
harness = false
