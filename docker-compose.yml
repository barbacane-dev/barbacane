# Docker Compose for local development
#
# Usage:
#   docker compose up -d postgres       # Database only (for cargo run dev)
#   docker compose up -d                # Full stack (postgres + control plane)
#
# The data plane serves only artifacts signed by the key it pins, so compile
# with a signing key and pin its public key:
#   barbacane key generate --out signing.pk8
#   BARBACANE_SIGNING_KEY=signing.pk8 make compile          # Uses tests/fixtures/minimal.yaml
#   BARBACANE_SIGNING_KEY=signing.pk8 make compile SPEC=path/to/api.yaml
#   export BARBACANE_TRUSTED_PUBKEY=$(barbacane key public --key signing.pk8)
#   docker compose --profile with-data-plane up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: barbacane
      POSTGRES_PASSWORD: barbacane
      POSTGRES_DB: barbacane
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbacane"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane:
    image: barbacane-control
    build:
      context: .
      dockerfile: Dockerfile.control
    environment:
      DATABASE_URL: postgres://barbacane:barbacane@postgres:5432/barbacane
      BARBACANE_CONTROL_ADMIN_TOKEN: ${BARBACANE_CONTROL_ADMIN_TOKEN:?set BARBACANE_CONTROL_ADMIN_TOKEN to a random secret}
    ports:
      - "9090:9090"  # API
    depends_on:
      postgres:
        condition: service_healthy

  data-plane:
    image: barbacane
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BARBACANE_TRUSTED_PUBKEY: ${BARBACANE_TRUSTED_PUBKEY:?set BARBACANE_TRUSTED_PUBKEY to the public key that signs artifact.bca (barbacane key public --key <file>)}
    ports:
      - "8080:8080"
    volumes:
      - ./artifact.bca:/config/api.bca:ro
    profiles:
      - with-data-plane

volumes:
  postgres_data:
