openapi: "3.1.0"
info:
  title: Typed values
  version: "1.0.0"

paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: session
          in: cookie
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9]{8}$"
        - name: theme
          in: cookie
          required: true
          schema:
            type: string
            enum: [light, dark]
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"ok":true}'
      responses:
        "200":
          description: OK
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name, age]
              properties:
                name:
                  type: string
                age:
                  type: integer
                  minimum: 0
      x-barbacane-dispatch:
        name: mock
        config:
          status: 201
      responses:
        "201":
          description: Created

  /reports/{ids}:
    get:
      operationId: getReports
      parameters:
        - name: ids
          in: path
          required: true
          schema:
            type: array
            items:
              type: integer
            maxItems: 3
        - name: filter
          in: query
          style: deepObject
          schema:
            type: object
            properties:
              year:
                type: integer
              draft:
                type: boolean
            additionalProperties: false
        - name: fields
          in: query
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [title, year]
        - name: tag
          in: query
          schema:
            type: array
            items:
              type: string
              maxLength: 5
        - name: X-Context
          in: header
          content:
            application/json:
              schema:
                type: object
                required: [tenant]
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
      responses:
        "200":
          description: OK

  /files/{name}:
    get:
      operationId: getFile
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z]+\\+[a-z]+$"
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
      responses:
        "200":
          description: OK
