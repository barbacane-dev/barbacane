# Mirrors CRS 959100: refuses the response once the outbound score reaches the
# outbound threshold the spec declares. Phase 4, and loaded after the response
# scoring rules so it reads the scores the phase-3 and phase-4 rules wrote.

SecRule TX:BLOCKING_OUTBOUND_ANOMALY_SCORE "@ge %{tx.outbound_anomaly_score_threshold}" \
    "id:1009120,\
    phase:4,\
    deny,status:403,\
    t:none,\
    msg:'Outbound Anomaly Score Exceeded (Total Score: %{TX.BLOCKING_OUTBOUND_ANOMALY_SCORE})',\
    tag:'fixture/anomaly'"
