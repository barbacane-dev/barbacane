# Response-phase scoring rules. Each adds to tx.blocking_outbound_anomaly_score
# and passes; rule 1009120 in 020-blocking.conf makes the blocking decision on
# the total against the outbound threshold the spec declares.

SecRule RESPONSE_HEADERS:X-Leak "@rx ." \
    "id:1003100,\
    phase:3,\
    pass,\
    t:none,\
    msg:'Response header leak',\
    tag:'fixture/response',\
    setvar:'tx.blocking_outbound_anomaly_score=+4'"

SecRule RESPONSE_BODY "@rx SECRET_TOKEN" \
    "id:1004100,\
    phase:4,\
    pass,\
    t:none,\
    msg:'Response body leak',\
    tag:'fixture/response',\
    setvar:'tx.blocking_outbound_anomaly_score=+4'"
