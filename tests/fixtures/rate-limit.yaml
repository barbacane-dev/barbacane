openapi: "3.1.0"
info:
  title: Rate Limit Test API
  version: "1.0.0"

paths:
  /limited:
    get:
      operationId: limitedEndpoint
      summary: Rate limited endpoint (3 req/60s)
      x-barbacane-middlewares:
        - name: rate-limit
          config:
            quota: 3
            window: 60
            policy_name: "test-policy"
            partition_key: "header:x-client-id"
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"message":"ok"}'
      responses:
        "200":
          description: Success
        "429":
          description: Rate limit exceeded

  /login:
    get:
      operationId: login
      summary: Two requests an hour per client
      x-barbacane-middlewares:
        - name: rate-limit
          config:
            quota: 2
            window: 3600
            policy_name: "login"
            partition_key: "header:x-client-id"
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"message":"ok"}'
      responses:
        "200":
          description: Success
        "429":
          description: Rate limit exceeded

  /items:
    get:
      operationId: listItems
      summary: A hundred requests a second per client, on the same partition key as /login
      x-barbacane-middlewares:
        - name: rate-limit
          config:
            quota: 100
            window: 1
            policy_name: "items"
            partition_key: "header:x-client-id"
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"message":"ok"}'
      responses:
        "200":
          description: Success
        "429":
          description: Rate limit exceeded

  /reports:
    get:
      operationId: listReports
      summary: One request an hour per client, the same window and partition key as /login
      x-barbacane-middlewares:
        - name: rate-limit
          config:
            quota: 1
            window: 3600
            policy_name: "reports"
            partition_key: "header:x-client-id"
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"message":"ok"}'
      responses:
        "200":
          description: Success
        "429":
          description: Rate limit exceeded

  /unlimited:
    get:
      operationId: unlimitedEndpoint
      summary: Endpoint without rate limiting
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"message":"unlimited"}'
      responses:
        "200":
          description: Success

  /per-user:
    get:
      operationId: perUserEndpoint
      summary: Rate limited per authenticated consumer (2 req/60s) via context:auth.sub
      security:
        - BasicAuth: []
      x-barbacane-middlewares:
        - name: basic-auth
          config:
            realm: "rl-test"
            credentials:
              - username: alice
                password: "alice123"
              - username: bob
                password: "bob123"
        - name: rate-limit
          config:
            quota: 2
            window: 60
            policy_name: "per-user"
            partition_key: "context:auth.sub"
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"message":"ok"}'
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "429":
          description: Rate limit exceeded

# The operations run an authentication middleware, so the document names the
# scheme carrying the credential. That is what admits the header (ADR-0033).

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
