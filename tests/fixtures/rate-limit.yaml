openapi: "3.1.0"
info:
  title: Rate Limit Test API
  version: "1.0.0"

paths:
  /limited:
    get:
      operationId: limitedEndpoint
      summary: Rate limited endpoint (3 req/60s)
      x-barbacane-middlewares:
        - name: rate-limit
          config:
            quota: 3
            window: 60
            policy_name: "test-policy"
            partition_key: "header:x-client-id"
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"message":"ok"}'
      responses:
        "200":
          description: Success
        "429":
          description: Rate limit exceeded

  /unlimited:
    get:
      operationId: unlimitedEndpoint
      summary: Endpoint without rate limiting
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"message":"unlimited"}'
      responses:
        "200":
          description: Success

  /per-user:
    get:
      operationId: perUserEndpoint
      summary: Rate limited per authenticated consumer (2 req/60s) via context:auth.sub
      x-barbacane-middlewares:
        - name: basic-auth
          config:
            realm: "rl-test"
            credentials:
              - username: alice
                password: "alice123"
              - username: bob
                password: "bob123"
        - name: rate-limit
          config:
            quota: 2
            window: 60
            policy_name: "per-user"
            partition_key: "context:auth.sub"
      x-barbacane-dispatch:
        name: mock
        config:
          status: 200
          body: '{"message":"ok"}'
      responses:
        "200":
          description: Success
        "401":
          description: Unauthorized
        "429":
          description: Rate limit exceeded

# The operations run an authentication middleware, so the document names the
# scheme carrying the credential. That is what admits the header (ADR-0033).
security:
  - BasicAuth: []

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
